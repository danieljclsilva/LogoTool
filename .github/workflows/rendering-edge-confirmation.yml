name: Round 4 Edge confirmation

on:
  pull_request:
    paths:
      - .github/workflows/rendering-edge-confirmation.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable source SHA to confirm
        required: true
        type: string
      arm:
        description: Worker and timeout policy
        type: choice
        options: [A, B, C, D]
        default: B

permissions:
  contents: read

concurrency:
  group: rendering-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confirm:
    name: Edge / ${{ matrix.shard }} of 4
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: true
      # Frozen source from the first complete A–D cohort on PR #7.
      SOURCE_REF: ${{ inputs.source_ref || '2f18ccfafd79a72b63d4051823fd686707d6e2e6' }}
      E2E_EXPERIMENT_ARM: ${{ inputs.arm || 'B' }}
      TEST_SHARD: ${{ matrix.shard }}/4
      PLAYWRIGHT_JSON_OUTPUT_FILE: ci-evidence/msedge/results.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/record-e2e-environment.mjs msedge
      - run: node scripts/run-rendering-experiment.mjs msedge
      - if: always()
        run: node scripts/summarize-e2e.mjs msedge
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: edge-${{ env.E2E_EXPERIMENT_ARM }}-part-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ci-evidence/msedge/
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: detail-edge-${{ env.E2E_EXPERIMENT_ARM }}-part-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
